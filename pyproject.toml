[project]
name = "my-app"
version = "0.1.0"
requires-python = "==3.11.*"
dependencies = [
    "fastapi[standard]",
    "sqlalchemy==2.0.36",
    "asyncpg==0.30.0",
    "pydantic-settings==2.6.1",
    "alembic==1.13.3",
    "email-validator==2.2.0",
    "passlib[bcrypt]==1.7.4",
    "bcrypt==4.0.1",
    "python-jose==3.3.0",
    "cryptography==43.0.3",
]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.uv.build-backend]
module-name = "app"
module-root = ""

[tool.setuptools]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["alembic/versions", ".venv", "__pycache__"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "UP",
    "C4",
]
ignore = [
    "B008",
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
exclude = ["alembic/", "tests/"]

[[tool.mypy.overrides]]
module = ["asyncpg.*", "httpx.*", "cryptography.*"]
ignore_missing_imports = true
