[project]
name = "my-app"
version = "0.1.0"
requires-python = "==3.11.*"

[tool.fastapi]
entrypoint = "app.main:app"

[tool.uv.build-backend]
module-name = "app"
module-root = ""

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["alembic/versions", ".venv", "__pycache__"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "UP",
    "C4",
]
ignore = [
    "B008",
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
exclude = ["alembic/", "tests/"]

[[tool.mypy.overrides]]
module = ["asyncpg.*"]
ignore_missing_imports = true
[tool.setuptools]
packages = ["app"]
